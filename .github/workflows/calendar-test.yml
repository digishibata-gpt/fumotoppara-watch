name: Calendar read test
on:
  workflow_dispatch:
  push:
    paths:
      - 'check_calendar.py'
      - '.github/workflows/calendar-test.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: python check_calendar.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calendar-diagnostics
          path: diagnostics/
          retention-days: 3
